<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>

body{
font-family:Arial;
text-align:center;
background:linear-gradient(120deg,#00c6ff,#0072ff);
color:white;
padding-top:100px;
}

.box{
background:white;
color:black;
padding:30px;
width:400px;
margin:auto;
border-radius:10px;
}

button{
background:#ff6600;
border:none;
padding:10px 20px;

border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Welcome to Secure Dashboard</h2>

<p>You have successfully logged in.</p>

<p>Zscaler + Azure AD Authentication Verified</p>

<button onclick="logout()">Logout</button>

</div>

<script>

function logout()
{
window.location="index.html";
}

</script>

</body>
</html>
